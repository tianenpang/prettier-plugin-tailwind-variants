name: Bug report
description: Unexpected formatting or a clear defect
title: '[bug]: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Search [existing issues](https://github.com/tianenpang/prettier-plugin-tailwind-variants/issues) first.
        Security → [SECURITY.md](https://github.com/tianenpang/prettier-plugin-tailwind-variants/blob/main/SECURITY.md).
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: Short description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal config, input, and actual output.
      placeholder: |
        // prettier.config.js
        plugins: [tailwindVariants(tailwindcss)],
        tvFunctions: ['tv'],

        // input
        tv({ base: ['text-white', 'px-4'] })

        // actual
        …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true

  - type: markdown
    attributes:
      value: '### Environment'

  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - macOS
        - Linux
        - Windows
        - Other
    validations:
      required: true
  - type: input
    id: os_version
    attributes:
      label: OS version
      placeholder: macOS 15.5
    validations:
      required: true
  - type: dropdown
    id: framework
    attributes:
      label: Where the code lives
      multiple: true
      options:
        - TypeScript / JavaScript
        - Vue
        - Svelte
        - Astro
        - HTML
        - Angular
        - Other
    validations:
      required: true
  - type: input
    id: framework_versions
    attributes:
      label: Framework versions
      description: N/A if plain TS/JS.
      placeholder: vue 3.5.x / N/A
    validations:
      required: true

  - type: markdown
    attributes:
      value: '### Versions'

  - type: input
    id: node_version
    attributes:
      label: Node.js
      placeholder: 22.14.0
    validations:
      required: true
  - type: input
    id: pnpm_version
    attributes:
      label: Package manager
      placeholder: pnpm 11.18.0
    validations:
      required: true
  - type: input
    id: prettier_version
    attributes:
      label: prettier
      placeholder: 3.9.x
    validations:
      required: true
  - type: input
    id: tw_plugin_version
    attributes:
      label: prettier-plugin-tailwindcss
      placeholder: 0.8.x
    validations:
      required: true
  - type: input
    id: this_package_version
    attributes:
      label: prettier-plugin-tailwind-variants
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: tailwindcss_version
    attributes:
      label: tailwindcss
      placeholder: 4.x
    validations:
      required: true
  - type: input
    id: tv_version
    attributes:
      label: tailwind-variants
      placeholder: 3.x
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Extra context
      description: Editor, CI vs local, custom options, stylesheet path…
    validations:
      required: false
