name: Setup
description: Set up pnpm and Node.js, then install dependencies from the lockfile

runs:
  using: composite
  steps:
    - name: Set up pnpm
      uses: pnpm/action-setup@v6
      with:
        run_install: false

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: pnpm
        check-latest: true
        registry-url: https://registry.npmjs.org

    - name: Install dependencies
      shell: bash
      env:
        # Skip git hook install in CI (hooks are local-only; CI runs checks explicitly)
        HUSKY: '0'
      run: pnpm install --frozen-lockfile
