name: Benchmark

on:
  pull_request:
    branches: [main]
    paths:
      - 'benchmark/**'
      - 'src/**'
      - 'tests/fixtures/**'
      - '.github/workflows/benchmark.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsdown.config.ts'

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run benchmark
        run: pnpm benchmark
