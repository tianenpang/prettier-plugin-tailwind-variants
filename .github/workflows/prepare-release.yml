name: Prepare Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Package version without a leading v prefix (for example 0.2.0)
        required: true

permissions:
  contents: write

jobs:
  create-draft:
    name: Create draft
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "TAG=v$VERSION" >> "$GITHUB_OUTPUT"

          PREV="$(git describe --tags --abbrev=0 --match 'v*' --exclude "v${VERSION}" 2>/dev/null || true)"
          echo "PREVIOUS_TAG=$PREV" >> "$GITHUB_OUTPUT"

      - name: Setup
        uses: ./.github/actions/setup

      - name: Extract release notes from CHANGELOG
        id: notes
        env:
          RELEASE_PREVIOUS_TAG: ${{ steps.version.outputs.PREVIOUS_TAG }}
          RELEASE_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          {
            echo "BODY<<EOF"
            pnpm release-notes "${{ steps.version.outputs.VERSION }}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: ${{ steps.version.outputs.TAG }}
          body: ${{ steps.notes.outputs.BODY }}
          draft: true
          generate_release_notes: false
          token: ${{ secrets.RELEASE_TOKEN }}
